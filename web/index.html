<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>プロンプト選択ビューア</title>
<style>
:root {
  color-scheme: light;
  --bg: #fcfcfb; --panel: #ffffff; --line: #e6e5e1;
  --text: #0b0b0b; --text2: #52514e; --muted: #8a8984;
  --accent: #2a78d6; --accent-soft: #cde2fb; --bar-off: #d9d8d3;
  --good: #0f7a3d; --good-bg: #e3f4e9; --bad: #c42b2b; --bad-bg: #fbe6e6; --extra-bg: #efeeea;
  --warn-bg: #fff4d6; --warn: #7a5600;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1a1a19; --panel: #232322; --line: #383835;
    --text: #ffffff; --text2: #c3c2b7; --muted: #8f8e86;
    --accent: #3987e5; --accent-soft: #1c3f6b; --bar-off: #4a4a46;
    --good: #5cc98a; --good-bg: #173a26; --bad: #ff8a8a; --bad-bg: #4a1f1f; --extra-bg: #2f2f2d;
    --warn-bg: #3d3110; --warn: #f2c95c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1a1a19; --panel: #232322; --line: #383835;
  --text: #ffffff; --text2: #c3c2b7; --muted: #8f8e86;
  --accent: #3987e5; --accent-soft: #1c3f6b; --bar-off: #4a4a46;
  --good: #5cc98a; --good-bg: #173a26; --bad: #ff8a8a; --bad-bg: #4a1f1f; --extra-bg: #2f2f2d;
  --warn-bg: #3d3110; --warn: #f2c95c;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.6 system-ui, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif; }
main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 22px; margin: 0 0 4px; }
.sub { color: var(--text2); margin: 0 0 20px; font-size: 14px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px;
  font: inherit; color: var(--text2); cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--text); border-color: var(--accent); font-weight: 600; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
label { font-size: 13px; color: var(--text2); display: block; margin-bottom: 4px; }
textarea, input[type=text], select { width: 100%; font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
textarea { resize: vertical; min-height: 40px; }
.row { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
@media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
.btn { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 9px 18px; font: inherit; font-weight: 600; cursor: pointer; }
.btn:disabled { opacity: .5; cursor: default; }
.ex { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.ex button { font: inherit; font-size: 13px; background: var(--extra-bg); color: var(--text2); border: 0; border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; margin-bottom: 12px; }
.controls > div { min-width: 140px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--text2); }
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 170px 1fr 52px; gap: 10px; align-items: center; font-size: 14px; }
.bar .track { position: relative; height: 18px; background: var(--extra-bg); border-radius: 4px; }
.bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--bar-off); }
.bar.on .fill { background: var(--accent); }
.bar.on .name { font-weight: 600; }
.bar .thr { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); opacity: .6; }
.bar .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--text2); }
@media (max-width: 640px) { .bar { grid-template-columns: 110px 1fr 44px; font-size: 13px; } }
.banner { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px; margin: 10px 0; font-size: 14px; }
.meta { color: var(--text2); font-size: 13px; margin-top: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--text2); font-weight: 600; }
tr.case { cursor: pointer; }
tr.case:hover { background: var(--extra-bg); }
.chip { display: inline-block; border-radius: 4px; padding: 0 6px; margin: 1px 2px; font-size: 12px; white-space: nowrap; }
.hit { background: var(--good-bg); color: var(--good); }
.miss { background: var(--bad-bg); color: var(--bad); font-weight: 600; }
.extra { background: var(--extra-bg); color: var(--muted); }
.fb { background: var(--warn-bg); color: var(--warn); }
.ok2 { background: var(--good-bg); color: var(--good); opacity: .8; }
.pick { font-size: 20px; font-weight: 700; }
.who { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; margin-top: 12px; font-size: 13px; }
.who div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.ctx { color: var(--muted); font-size: 12px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--text2); margin-bottom: 8px; }
.detail td { background: var(--bg); }
.hidden { display: none; }
.choice { font-size: 14px; }
.table-wrap { overflow-x: auto; }
.overview td, .overview th { white-space: nowrap; }
.overview tr.sel td { background: var(--accent-soft); }
.overview tr { cursor: pointer; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; font-size: 14px; border: 0; background: var(--bg); color: var(--text2); padding: 6px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>プロンプト選択ビューア</h1>
  <p class="sub">求人相談AI(架空のサービス「ハタラクラフト」)で、発話ごとにシステムプロンプトを1つ選びます。Jev と LLM 分類器(gpt-5.4-nano / gpt-6-luna / gpt-6-sol)を、12候補と6分類で比べた結果(v3)を見られます。結果の詳細は <a href="https://github.com/milkmaccya2/jev-prompt-selection/blob/main/results/v3/summary.md">summary</a>。</p>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="try">試す(Jev)</button>
    <button role="tab" aria-selected="false" data-tab="eval">比較(100件)</button>
  </div>

  <section id="tab-try">
    <div class="panel">
      <div class="row">
        <div><label for="c-user">直前のユーザー発話(任意)</label><textarea id="c-user" rows="1"></textarea></div>
        <div><label for="c-asst">直前のアシスタント応答(任意)</label><textarea id="c-asst" rows="1"></textarea></div>
      </div>
      <div style="margin-top:12px"><label for="utt">今回のユーザー発話</label>
        <input id="utt" type="text" placeholder="例: 名駅あたりで事務の正社員ない?"></div>
      <div style="margin-top:12px; display:flex; gap:12px; align-items:center; flex-wrap:wrap">
        <div class="seg" id="t-gran"><button data-g="fine" aria-pressed="true">12候補</button><button data-g="coarse" aria-pressed="false">6分類</button></div>
        <button class="btn" id="run">Jev で判定</button>
        <span class="meta" id="budget"></span>
      </div>
      <div class="ex" id="examples"></div>
    </div>
    <div class="panel hidden" id="live">
      <div class="stats" id="l-stats"></div>
      <div class="bars" id="l-bars"></div>
      <p class="meta" id="l-meta"></p>
    </div>
  </section>

  <section id="tab-eval" class="hidden">
    <div class="panel">
      <div style="margin-bottom:12px; display:flex; gap:12px; align-items:center; flex-wrap:wrap">
        <div class="seg" id="e-set"><button data-s="test" aria-pressed="true">test(主)</button><button data-s="dev" aria-pressed="false">dev(参考)</button></div>
        <span class="meta" id="e-setnote" style="margin:0"></span>
      </div>
      <div class="table-wrap"><table class="overview">
        <thead><tr><th>構成</th><th>粒度</th><th class="num">答えと一致 [95%CI]</th><th class="num">別解込み</th><th class="num">判定時間 p50 / p95</th><th class="num">費用 / 1000回</th></tr></thead>
        <tbody id="o-rows"></tbody>
      </table></div>
      <p class="meta" id="e-run"></p>
    </div>
    <div class="panel">
      <div class="controls">
        <div><label for="e-cfg">構成</label><select id="e-cfg"></select></div>
        <div><label for="e-tag">タグ</label><select id="e-tag"><option value="">すべて</option></select></div>
        <div><label><input type="checkbox" id="e-wrong"> 間違いのみ</label></div>
      </div>
      <div class="legend">
        <span><span class="chip hit">✓ 正解</span></span>
        <span><span class="chip ok2">✓ 別解</span></span>
        <span><span class="chip miss">✗ 間違い</span></span>
        <span>Jev の行はクリックすると候補ごとの確率を表示</span>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>id</th><th>発話</th><th>正解</th><th>選んだもの</th><th class="num">確信度</th><th class="num">時間</th></tr></thead>
        <tbody id="e-rows"></tbody>
      </table></div>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const pct = (v) => (v == null ? '-' : `${Math.round(v * 100)}%`);
const sec = (ms) => (ms == null ? '-' : ms >= 1000 ? `${(ms / 1000).toFixed(2)}秒` : `${Math.round(ms)}ms`);
const BASE = 'base';
const LABEL = {
  search_conditions: '検索条件', query_normalization: '地名・職種の言い換え', company_info: '企業情報', reviews: 'クチコミ',
  salary_benefits: '給与・待遇', career_advice: 'キャリア相談', application_docs: '応募書類', interview_prep: '面接対策',
  account_terms: 'ログイン・規約', error_handling: 'エラー時', out_of_scope: '範囲外', base: '基本',
  consult: '相談', docs: '書類作成', info: '情報提供', howto: 'ハウツー',
};
const GRAN = { fine: '12候補', coarse: '6分類' };
const lab = (id) => LABEL[id] ?? id;
let D, gran = 'fine', lastLive = null;

const toCoarse = (id) => D.coarse.find((c) => c.members.includes(id))?.id ?? id;
function gold(c, g) {
  if (g === 'fine') return { answer: c.answer, acc: c.acceptable };
  const a = toCoarse(c.answer);
  return { answer: a, acc: [...new Set(c.acceptable.map(toCoarse))].filter((x) => x !== a) };
}
function wilson(k, n, z = 1.96) {
  const p = k / n, d = 1 + (z * z) / n, c = p + (z * z) / (2 * n);
  const h = z * Math.sqrt((p * (1 - p)) / n + (z * z) / (4 * n * n));
  return [(c - h) / d, (c + h) / d];
}
const pctl = (xs, q) => { const s = [...xs].sort((a, b) => a - b); return s[Math.min(s.length - 1, Math.ceil(q * s.length) - 1)]; };

function barsHtml(probs, chosen, answer, acceptable) {
  return Object.entries(probs).sort((a, b) => b[1] - a[1]).map(([id, p]) => {
    const tag = answer ? (id === answer ? ' <span class="chip hit">正解</span>' : (acceptable ?? []).includes(id) ? ' <span class="chip ok2">可</span>' : '') : '';
    return `<div class="bar${id === chosen ? ' on' : ''}"><span class="name">${esc(lab(id))}${tag}</span>
      <span class="track"><span class="fill" style="width:${(p * 100).toFixed(1)}%"></span></span>
      <span class="val">${p.toFixed(2)}</span></div>`;
  }).join('');
}

// ---------- 試す ----------
function renderLive() {
  const r = lastLive?.result;
  if (!r) return;
  const chosen = r.ok ? r.chosen : BASE;
  $('l-stats').innerHTML = `
    <div class="stat"><b class="pick">${esc(lab(chosen))}</b><span>使うプロンプト(${GRAN[lastLive.g]})${r.ok ? '' : `<br>判定できず基本を使用: ${esc(r.error ?? '')}`}</span></div>
    <div class="stat"><b>${r.confidence != null ? r.confidence.toFixed(2) : '-'}</b><span>確信度</span></div>
    <div class="stat"><b>${sec(r.latencyMs)}</b><span>判定にかかった時間</span></div>`;
  $('l-bars').innerHTML = r.ok ? barsHtml(r.probs, chosen) : '';
  $('l-meta').textContent = r.ok ? `モデル ${r.model} / 判定に使った入力 ${r.inputTokens.toLocaleString()} tok` : '';
}
function showBudget(b) { $('budget').textContent = b ? `この画面の費用: $${b.spentUsd.toFixed(4)} / 上限 $${b.limitUsd}` : ''; }
$('t-gran').onclick = (e) => {
  const g = e.target.dataset?.g; if (!g) return;
  gran = g; $('t-gran').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.g === g));
};
$('run').onclick = async () => {
  const utterance = $('utt').value.trim();
  if (!utterance) return;
  const context = [{ role: 'user', text: $('c-user').value }, { role: 'assistant', text: $('c-asst').value }];
  $('run').disabled = true; $('run').textContent = '判定中…';
  try {
    const res = await fetch('/api/select', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ context, utterance, granularity: gran }) });
    const j = await res.json();
    if (!res.ok) throw new Error(j.error);
    lastLive = { ...j, g: gran }; showBudget(j.budget);
    $('live').classList.remove('hidden'); renderLive();
  } catch (e) { $('budget').textContent = 'エラー: ' + e.message; }
  finally { $('run').disabled = false; $('run').textContent = 'Jev で判定'; }
};
$('utt').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) $('run').click(); });

// ---------- 比較 ----------
let cfgKey = 'jev@fine', openId = null, setKey = 'test';
const S = () => D.sets[setKey];
function scored(cfg) {
  const R = new Map(S().run.cases.map((c) => [c.id, c.results[cfg.key]]));
  return S().cases.filter((c) => R.has(c.id)).map((c) => {
    const r = R.get(c.id), g = gold(c, cfg.granularity);
    const chosen = r?.ok && r.chosen ? r.chosen : null; // v3: a failed call is wrong
    const v = chosen === g.answer ? 'correct' : chosen && g.acc.includes(chosen) ? 'acceptable' : 'wrong';
    return { c, r, g, chosen, v };
  });
}
function renderOverview() {
  $('o-rows').innerHTML = S().run.configs.map((cfg) => {
    const rows = scored(cfg), n = rows.length;
    const k = rows.filter((x) => x.v === 'correct').length, kl = rows.filter((x) => x.v !== 'wrong').length;
    const [lo, hi] = wilson(k, n);
    const lat = rows.filter((x) => x.r.ok).map((x) => x.r.latencyMs), cost = rows.reduce((s, x) => s + x.r.costUsd, 0) / n * 1000;
    return `<tr data-key="${cfg.key}" class="${cfg.key === cfgKey ? 'sel' : ''}"><td>${esc(cfg.label)}</td><td>${GRAN[cfg.granularity]}</td><td class="num">${pct(k / n)} [${pct(lo)}–${pct(hi)}]</td><td class="num">${pct(kl / n)}</td><td class="num">${sec(pctl(lat, 0.5))} / ${sec(pctl(lat, 0.95))}</td><td class="num">$${cost.toFixed(3)}</td></tr>`;
  }).join('');
  const models = [...new Set(S().run.cases.flatMap((c) => Object.values(c.results).map((r) => r.model)).filter(Boolean))].join(', ');
  $('e-run').textContent = `実行 ${S().run.startedAt} / ${S().run.cases.length}件 / 正解は data/eval.v3.${setKey}.jsonl / 失敗は不正解として採点 / 返ってきたモデル名: ${models}。費用は実績(OpenAI はプロンプトキャッシュ込み)。行をクリックすると下の一覧が切り替わります`;
}
$('o-rows').onclick = (e) => { const tr = e.target.closest('tr'); if (!tr) return; cfgKey = tr.dataset.key; $('e-cfg').value = cfgKey; openId = null; renderEval(); };
function renderEval() {
  renderOverview();
  const cfg = S().run.configs.find((x) => x.key === cfgKey);
  const isJev = cfg.classifier === 'jev';
  const tag = $('e-tag').value, wrongOnly = $('e-wrong').checked;
  const view = scored(cfg).filter((x) => (!tag || x.c.tags.includes(tag)) && (!wrongOnly || x.v === 'wrong'));
  if (!view.length) { $('e-rows').innerHTML = '<tr><td colspan="6" class="meta">該当する件はありません(別解まで含めて全件正解)</td></tr>'; return; }
  $('e-rows').innerHTML = view.map((x) => {
    const chip = x.v === 'correct' ? `<span class="chip hit">✓ ${esc(lab(x.chosen))}</span>`
      : x.v === 'acceptable' ? `<span class="chip ok2">✓ ${esc(lab(x.chosen))}(可)</span>`
      : `<span class="chip miss">✗ ${x.chosen ? esc(lab(x.chosen)) : '(失敗)'}</span>`;
    const ans = esc(lab(x.g.answer)) + (x.g.acc.length ? `<div class="ctx">別解: ${esc(x.g.acc.map(lab).join('、'))}</div>` : '');
    const ctx = x.c.context.length ? `<div class="ctx">文脈: ${esc(x.c.context.map((t) => (t.role === 'user' ? 'U: ' : 'A: ') + t.text.split('\n')[0]).join(' / '))}</div>` : '';
    const detail = openId === x.c.id && isJev && x.r?.probs ? `<tr class="detail"><td></td><td colspan="5">
      <div class="bars">${barsHtml(x.r.probs, x.chosen, x.g.answer, x.g.acc)}</div>
      <div class="meta">ラベルの理由: ${esc(x.c.reason ?? '')}</div></td></tr>` : '';
    return `<tr class="case" data-id="${x.c.id}"><td>${x.c.id}</td><td>${esc(x.c.utterance)}${ctx}</td><td>${ans}</td><td>${chip}</td><td class="num">${x.r?.confidence != null ? x.r.confidence.toFixed(2) : '-'}</td><td class="num">${sec(x.r?.latencyMs)}</td></tr>${detail}`;
  }).join('');
}
$('e-rows').onclick = (e) => { const tr = e.target.closest('tr.case'); if (!tr) return; openId = openId === tr.dataset.id ? null : tr.dataset.id; renderEval(); };
$('e-cfg').addEventListener('input', () => { cfgKey = $('e-cfg').value; openId = null; renderEval(); });
for (const id of ['e-tag', 'e-wrong']) $(id).addEventListener('input', renderEval);
const SETNOTE = {
  test: 'test: 評価用に新しく作った100件。主な結論はこちら',
  dev: 'dev: v1・v2 と同じ100件。説明文を直すときに見ているので参考',
};
function fillTags() {
  const tags = [...new Set(S().cases.flatMap((c) => c.tags))].sort();
  $('e-tag').innerHTML = '<option value="">すべて</option>' + tags.map((t) => `<option>${esc(t)}</option>`).join('');
}
$('e-set').onclick = (e) => {
  const s = e.target.dataset?.s; if (!s) return;
  setKey = s; openId = null;
  $('e-set').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.s === s));
  $('e-setnote').textContent = SETNOTE[s];
  fillTags(); renderEval();
};

document.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach((x) => x.setAttribute('aria-selected', x === b));
  $('tab-try').classList.toggle('hidden', b.dataset.tab !== 'try');
  $('tab-eval').classList.toggle('hidden', b.dataset.tab !== 'eval');
});

(async () => {
  D = await (await fetch('/api/data')).json();
  showBudget(D.budget);
  if (!D.live) { $('run').disabled = true; $('budget').textContent = 'TYPESAFE_API_KEY が未設定のため、判定は使えません'; }
  const ex = ['名駅あたりで事務の正社員ない?', 'Nホームって残業多い?', 'ありがとう!助かった', '面接で希望年収聞かれたらなんて答えればいい?', '他の求人サイトとどっちが使いやすい?'];
  $('examples').innerHTML = ex.map((t) => `<button>${esc(t)}</button>`).join('');
  $('examples').onclick = (e) => { if (e.target.tagName === 'BUTTON') { $('utt').value = e.target.textContent; $('run').click(); } };
  $('e-cfg').innerHTML = S().run.configs.map((c) => `<option value="${c.key}">${esc(c.label)} / ${GRAN[c.granularity]}</option>`).join('');
  $('e-setnote').textContent = SETNOTE[setKey];
  fillTags();
  renderEval();
})();
</script>
</body>
</html>
